services:
  db:
    image: postgres:15
    container_name: avito_db
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito123
      POSTGRES_DB: avito
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito"]
      interval: 5s
      timeout: 3s
      retries: 5

  main-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito_main_api
    environment:
      DATABASE_URL: postgresql://avito:avito123@db:5432/avito
      RESTAURANT_API_URL: http://restaurant-example:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  restaurant-example:
    build:
      context: ./restaurant-example
      dockerfile: Dockerfile
    container_name: avito_restaurant_example
    environment:
      MAIN_API_URL: http://main-api:8000
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./restaurant-example:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  postgres_data: